# Tekshir — iPhone ilovasi. Xcode loyihasi shu fayldan yaratiladi:  xcodegen   (README.md ga qarang)
name: Tekshir
options:
  bundleIdPrefix: uz.ahdigital
  deploymentTarget:
    iOS: "16.4"          # 16.4 — JavaScriptCore'da mexanizmga kerakli RegExp imkoniyatlari bor
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # ---------- Ilova ----------
  Tekshir:
    type: application
    platform: iOS
    sources:
      - path: Tekshir
      - path: Resources          # engine.js, yordam.js, maslahatlar.js — botdagi mexanizm va matnlar
        buildPhase: resources
    dependencies:
      - target: TekshirShare     # ↗️ «Ulashish → Tekshir»
      - target: TekshirWidget    # 🧩 vidjet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.ahdigital.tekshir
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: Tekshir/Info.plist
      properties:
        CFBundleDisplayName: Tekshir
        CFBundleDevelopmentRegion: uz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBg
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [tg]
        CFBundleURLTypes:        # vidjet bosilganda: tekshir://check, tekshir://tips
          - CFBundleURLName: uz.ahdigital.tekshir
            CFBundleURLSchemes: [tekshir]
        NSCameraUsageDescription: "QR kodni skanerlash uchun kamera kerak. Rasm hech qayerga yuborilmaydi. / Камера нужна только для сканирования QR-кода."

  # ---------- ↗️ Ulashish kengaytmasi ----------
  TekshirShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Tekshir/Engine.swift
      - path: Tekshir/Store.swift
      - path: Tekshir/Strings.swift
      - path: Tekshir/Theme.swift
      - path: Tekshir/Checker.swift
      - path: Tekshir/Scan.swift
      - path: Tekshir/Views/ResultViews.swift
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.ahdigital.tekshir.share
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Tekshir
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1

  # ---------- 🧩 Vidjet ----------
  TekshirWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Tekshir/Engine.swift
      - path: Tekshir/Store.swift
      - path: Tekshir/Strings.swift
      - path: Tekshir/Theme.swift
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.ahdigital.tekshir.widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Tekshir
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
