<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<style>
:root{--bg:#f6efe4;--ink:#26283a;--acc:#c67139;--acc2:#e0708a;--card:#fff;--muted:#7a7468}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#bg{position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,#ffd9c2 0,transparent 40%),radial-gradient(circle at 5% 95%,#d9ead0 0,transparent 35%),var(--bg)}
#grid{position:absolute;inset:0;background-image:linear-gradient(#26283a08 1px,transparent 1px),linear-gradient(90deg,#26283a08 1px,transparent 1px);background-size:60px 60px}
#top{position:absolute;left:56px;top:40px;display:flex;align-items:center;gap:18px;z-index:5}
#top .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:30px}
#top .brand i{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px}
#chap{background:var(--ink);color:#fff;font-weight:800;font-size:22px;padding:8px 18px;border-radius:999px}
#stage{position:absolute;left:0;right:0;top:110px;height:770px;z-index:3}
#sub{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1560px;background:#26283aee;color:#fff;font-weight:700;font-size:38px;line-height:1.3;padding:16px 34px;border-radius:20px;text-align:center;z-index:6}
.scene{position:absolute;inset:0}
.card{background:var(--card);border-radius:28px;box-shadow:0 24px 60px #26283a1f}
/* brauzer */
.browser{position:absolute;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px #26283a33}
.browser .bar{height:52px;background:#ece7df;display:flex;align-items:center;gap:10px;padding:0 20px}
.browser .bar i{width:14px;height:14px;border-radius:50%}
.browser .url{margin-left:18px;flex:1;background:#fff;border-radius:999px;height:32px;display:flex;align-items:center;padding:0 18px;font-size:18px;color:#666}
.browser .view{position:absolute;left:0;right:0;top:52px;bottom:0;overflow:hidden;background:#fff}
.browser .view img{position:absolute;left:0;top:0;width:100%}
/* chat */
.chat{position:absolute;left:260px;right:260px;top:20px;bottom:40px;background:#fbfaf7;border-radius:28px;box-shadow:0 30px 80px #26283a26;overflow:hidden}
.chat .head{height:64px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid #eee;font-weight:800;font-size:22px}
.chat .head b{width:36px;height:36px;border-radius:10px;background:#d97757;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.chat .tag{margin-left:auto;background:var(--acc);color:#fff;border-radius:999px;padding:6px 16px;font-size:18px}
.chat .body{padding:26px 34px;display:flex;flex-direction:column;gap:20px}
.msg.user{align-self:flex-end;max-width:88%;background:#efe9df;border-radius:22px 22px 6px 22px;padding:18px 24px;font-size:23px;line-height:1.45;white-space:pre-wrap}
.msg.bot{align-self:flex-start;max-width:80%;font-size:24px;line-height:1.45;display:flex;gap:14px;align-items:flex-start}
.msg.bot b{flex:none;width:36px;height:36px;border-radius:10px;background:#d97757;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.caret{display:inline-block;width:3px;height:26px;background:var(--ink);vertical-align:-4px;margin-left:2px}
/* telefon */
.phone{position:absolute;width:420px;height:760px;border-radius:56px;background:#1b1a19;padding:14px;box-shadow:0 30px 80px #26283a40}
.phone .scr{width:100%;height:100%;border-radius:44px;overflow:hidden;position:relative;background:#fff}
.phone .scr img{position:absolute;left:0;top:0;width:100%}
.big{font-weight:900;letter-spacing:-1px}
.pill{display:inline-block;background:var(--acc);color:#fff;font-weight:800;border-radius:999px;padding:8px 22px}
.ring{position:absolute;border:6px solid #e53935;border-radius:999px;box-shadow:0 0 0 8px #e5393533}
.cursor{position:absolute;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:40px solid #26283a;transform:rotate(-25deg);filter:drop-shadow(0 4px 6px #0005)}
</style><style>
.paper{background:#fffdf4;border:1px solid #e8dfc4;border-radius:10px;padding:14px 18px;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:19px;line-height:1.5;transform:rotate(-2deg);box-shadow:0 6px 14px #0002;margin-bottom:12px;display:inline-block}
.warnb{position:absolute;left:50%;top:640px;transform:translateX(-50%);background:#fff3d6;border:2px solid #f2b33d;border-radius:18px;padding:14px 30px;font-size:30px;font-weight:800;white-space:nowrap}
.ring{position:absolute;border:6px solid #e53935;border-radius:999px;box-shadow:0 0 0 8px #e5393533}
.msg.user .tx{white-space:pre-wrap}
</style>
</head>
<body>
<div id="bg"></div><div id="grid"></div>
<div id="top"><div class="brand"><i>AH</i>AHdigital</div><div id="chap"></div></div>
<div id="stage"></div>
<div id="sub"></div>
<script src="yt15-script.js"></script></body></html>
