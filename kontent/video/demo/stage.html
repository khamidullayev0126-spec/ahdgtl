<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 80% 20%,#123a2c,#0b1220 55%,#070b14);color:#f1f5f9}
#cap{position:absolute;left:120px;top:0;bottom:0;width:820px;display:flex;flex-direction:column;justify-content:center}
#step{display:inline-block;align-self:flex-start;background:#22c55e;color:#04130a;font-weight:900;font-size:30px;border-radius:999px;padding:8px 24px}
#title{font-size:74px;font-weight:900;line-height:1.08;margin-top:24px;letter-spacing:-1px}
#sub{font-size:34px;color:#94a3b8;margin-top:22px;line-height:1.4}
#brand{position:absolute;left:120px;bottom:60px;font-size:28px;font-weight:800;color:#94a3b8}
#brand b{color:#22c55e}
.phone{position:absolute;right:220px;top:50%;transform:translateY(-50%);width:430px;height:900px;border-radius:60px;background:#111827;padding:18px;box-shadow:0 40px 100px #000a,0 0 0 2px #334155}
.phone .scr{width:394px;height:864px;border-radius:44px;overflow:hidden;position:relative;background:#0b1220}
iframe{width:394px;height:864px;border:0;display:block}
#shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 34%;display:none}
#big{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:inherit}
</style></head><body>
<div id="cap"><span id="step"></span><div id="title"></div><div id="sub"></div></div>
<div id="brand">🛡 <b>Tekshir</b> · AHdigital</div>
<div class="phone"><div class="scr"><iframe id="app"></iframe><img id="shot"></div></div>
<div id="big"></div>
<script>
window.cap = (step, title, sub) => { document.getElementById("step").textContent = step; document.getElementById("step").style.display = step ? "" : "none";
  document.getElementById("title").innerHTML = title; document.getElementById("sub").innerHTML = sub || ""; };
window.shot = src => { const s = document.getElementById("shot"); if (src) { s.src = src; s.style.display = "block"; } else s.style.display = "none"; };
window.big = html => { const b = document.getElementById("big"); b.innerHTML = html || ""; b.style.display = html ? "flex" : "none"; };
</script></body></html>
