<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Caprasimo;src:url(/f/Caprasimo.ttf)}
@font-face{font-family:Figtree;font-weight:800;src:url(/f/Figtree-800.ttf)}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f5ead8}
canvas{display:block}
#cap{position:absolute;left:60px;right:60px;top:200px;text-align:center;font:400 92px/1.05 Caprasimo;color:#201e1d;text-shadow:0 4px 0 rgba(255,255,255,.6)}
#cap .a{color:#c4602f}
#sub{position:absolute;left:0;right:0;bottom:250px;text-align:center}
#sub span{display:inline-block;background:#201e1d;color:#f5ead8;font:800 46px Figtree;padding:16px 34px;border-radius:999px}
#logo{position:absolute;left:50%;top:90px;transform:translateX(-50%);font:400 40px Caprasimo;color:#201e1d;opacity:.85}
</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script>
</head><body>
<div id="logo">AHdigital</div>
<div id="cap"></div>
<div id="sub"><span id="subt"></span></div>
<script type="module">
import * as THREE from "three";
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#f5ead8");
scene.fog = new THREE.Fog("#f5ead8", 14, 30);
const cam = new THREE.PerspectiveCamera(38, W / H, 0.1, 100);

// Yorug'lik: iliq asosiy, sovuq to'ldiruvchi, orqa kontur
scene.add(new THREE.HemisphereLight("#fff6ea", "#d9c4a6", 1.1));
const key = new THREE.DirectionalLight("#fff1dc", 2.4);
key.position.set(-5, 9, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -10; key.shadow.camera.right = 10; key.shadow.camera.top = 10; key.shadow.camera.bottom = -10; key.shadow.radius = 6; key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight("#cfe0ff", 0.7); rim.position.set(6, 4, -6); scene.add(rim);

// Qog'oz material (qirrali — flatShading)
const paper = (c, r = 0.85) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0, flatShading: true, side: THREE.DoubleSide });
const C = { or: "#e07a4a", or2: "#f0a06f", cream: "#fbf3e6", gray: "#d9d9d4", gray2: "#efefec", dark: "#2b2b2b", ink: "#201e1d" };
const mesh = (g, m, cast = true) => { const o = new THREE.Mesh(g, m); o.castShadow = cast; o.receiveShadow = true; return o; };

// Yer: qog'oz varaq
const ground = mesh(new THREE.PlaneGeometry(60, 60), paper("#efe1c8", 1), false);
ground.rotation.x = -Math.PI / 2; scene.add(ground);
// Yo'l: kichik qog'oz plitalar
for (let i = -6; i <= 6; i++) {
  const s = mesh(new THREE.BoxGeometry(0.7, 0.03, 0.5), paper(i % 2 ? "#f7eddc" : "#eadbc0"), false);
  s.position.set(i * 0.62, 0.015, 0.6); s.rotation.y = (i % 3) * 0.08; scene.add(s);
}

// Matnli tekstura
function textTex(lines, { bg = "#fbf3e6", fg = "#201e1d", w = 512, h = 320, size = 64, font = "Caprasimo", mono = false } = {}) {
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const x = cv.getContext("2d"); x.fillStyle = bg; x.fillRect(0, 0, w, h);
  x.fillStyle = fg; x.textAlign = mono ? "left" : "center"; x.textBaseline = "middle";
  x.font = `${mono ? "800" : "400"} ${size}px ${mono ? "Figtree" : font}`;
  lines.forEach((l, i) => x.fillText(l, mono ? 36 : w / 2, h / 2 + (i - (lines.length - 1) / 2) * size * 1.25));
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

// Uy: quti + 4 qirrali tom + eshik + nom taxtachasi
function house(wall, roof, name, nameBg, nameFg) {
  const g = new THREE.Group();
  const body = mesh(new THREE.BoxGeometry(2.2, 1.6, 1.8), paper(wall)); body.position.y = 0.8; g.add(body);
  const r = mesh(new THREE.ConeGeometry(1.75, 1.2, 4, 1), paper(roof)); r.position.y = 2.2; r.rotation.y = Math.PI / 4; g.add(r);
  const door = mesh(new THREE.BoxGeometry(0.55, 0.9, 0.05), paper(roof)); door.position.set(0, 0.45, 0.92); g.add(door);
  const sign = mesh(new THREE.BoxGeometry(1.9, 0.5, 0.04), new THREE.MeshStandardMaterial({ map: textTex([name], { bg: nameBg, fg: nameFg, w: 760, h: 200, size: 96 }), roughness: 0.9 }));
  sign.position.set(0, 1.3, 0.93); g.add(sign);
  return g;
}
const claudeHouse = house(C.cream, C.or, "Claude Code", "#e07a4a", "#fff7ee");
claudeHouse.position.set(-3.2, 0, -0.6); claudeHouse.rotation.y = 0.35; scene.add(claudeHouse);
const codexHouse = house(C.gray2, C.dark, "Codex", "#2b2b2b", "#f2f2ef");
codexHouse.position.set(3.2, 0, -0.6); codexHouse.rotation.y = -0.35; scene.add(codexHouse);

// Daraxtlar (origami archa)
[[-5.6, -2.5], [-1.4, -3.2], [1.2, -3.4], [5.8, -2.4], [-6.5, 1.5], [6.6, 1.8]].forEach(([x, z], i) => {
  const t = mesh(new THREE.ConeGeometry(0.45, 1.4, 5), paper(i % 2 ? "#9bb07a" : "#b4c48f")); t.position.set(x, 0.7, z); scene.add(t);
});

// Origami bola
const boy = new THREE.Group();
const bodyM = paper(C.or2), skin = paper("#f6d2b1"), hair = paper("#3a2a22");
const torso = mesh(new THREE.ConeGeometry(0.32, 0.75, 4), bodyM); torso.position.y = 0.62; torso.rotation.y = Math.PI / 4; boy.add(torso);
const head = mesh(new THREE.IcosahedronGeometry(0.24, 0), skin); head.position.y = 1.18; boy.add(head);
const cap = mesh(new THREE.ConeGeometry(0.25, 0.16, 5), hair); cap.position.y = 1.36; boy.add(cap);
const eyeM = new THREE.MeshBasicMaterial({ color: C.ink });
[-0.08, 0.08].forEach(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 6), eyeM); e.position.set(x, 1.2, 0.21); boy.add(e); });
const legL = mesh(new THREE.BoxGeometry(0.1, 0.32, 0.1), paper("#5b6b8a")), legR = legL.clone();
legL.position.set(-0.1, 0.16, 0); legR.position.set(0.1, 0.16, 0); boy.add(legL, legR);
const armL = mesh(new THREE.BoxGeometry(0.08, 0.34, 0.08), bodyM), armR = armL.clone();
armL.position.set(-0.3, 0.72, 0); armR.position.set(0.3, 0.72, 0); boy.add(armL, armR);
scene.add(boy);

// Boshidagi qog'oz varaq (buklanadi)
const sheet = new THREE.Group();
const halfA = mesh(new THREE.PlaneGeometry(0.9, 1.8), paper("#fbf3e6")), halfB = halfA.clone();
halfA.geometry = halfA.geometry.clone().translate(0.45, 0, 0); halfB.geometry = halfB.geometry.clone().translate(-0.45, 0, 0);
sheet.add(halfA, halfB); sheet.position.set(-2.2, 1.1, 0.8); scene.add(sheet);

// Terminallar
function terminal(bg, fg, lines) {
  const g = new THREE.Group();
  const stand = mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), paper(bg === "#2b2b2b" ? "#555" : C.or)); stand.position.y = 0.3; g.add(stand);
  const scr = mesh(new THREE.BoxGeometry(1.5, 1, 0.08), new THREE.MeshStandardMaterial({ map: textTex(lines, { bg, fg, w: 600, h: 400, size: 40, mono: true }), roughness: 0.7 }));
  scr.position.y = 1.05; g.add(scr); g.userData.scr = scr; return g;
}
const codexTerm = terminal("#2b2b2b", "#e9e9e6", ["$ codex", "> yangi loyiha...", "> kod yozilmoqda ▍"]);
codexTerm.position.set(3.7, 0, 1.3); codexTerm.rotation.y = -0.9; scene.add(codexTerm);
const claudeTerm = terminal("#fbf3e6", "#c4602f", ["$ claude", "", "Qaytganingdan", "xursandman 🙂"]);
claudeTerm.position.set(-0.8, 0, 1.0); claudeTerm.rotation.y = -0.25; scene.add(claudeTerm);

// Uchadigan kod chiziqlari (Codex)
const strips = [];
for (let i = 0; i < 8; i++) {
  const s = mesh(new THREE.BoxGeometry(0.42, 0.06, 0.01), paper(i % 2 ? "#e9e9e6" : "#bdbdb8"));
  scene.add(s); strips.push(s);
}

// Xotira kartochkalari (Claude)
const cardNames = ["CLAUDE.md", "skill'larim", "loyihalarim"];
const cards = cardNames.map(n => {
  const c = mesh(new THREE.BoxGeometry(1.05, 0.62, 0.02), [paper(C.or), paper(C.or), paper(C.or), paper(C.or),
    new THREE.MeshStandardMaterial({ map: textTex([n], { bg: "#f0a06f", fg: "#201e1d", w: 520, h: 300, size: 70 }), roughness: 0.9 }), paper(C.or)]);
  scene.add(c); return c;
});

// Qog'oz samolyot
const pg = new THREE.BufferGeometry();
pg.setAttribute("position", new THREE.Float32BufferAttribute([
  0, 0, 1.1, -0.75, 0.05, -0.6, 0, 0, -0.45,
  0, 0, 1.1, 0, 0, -0.45, 0.75, 0.05, -0.6,
  0, 0, 1.1, 0, 0, -0.45, 0, -0.22, -0.5
], 3)); pg.computeVertexNormals();
const plane = mesh(pg, paper(C.or)); scene.add(plane);

// ---------- Vaqtga bog'liq animatsiya ----------
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => cl((t - a) / (b - a));
const ease = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, p) => a + (b - a) * p;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
let B = window.BEATS || {};
window.setBeats = b => (B = b);

const capEl = document.getElementById("cap"), subEl = document.getElementById("subt");
function caption(t) {
  const list = B.captions || [];
  const c = list.filter(x => t >= x.t).pop();
  const p = c ? ease(lin(t, c.t, c.t + 0.35)) : 0;
  capEl.innerHTML = c ? c.html : ""; capEl.style.opacity = p; capEl.style.transform = `translateY(${(1 - p) * 30}px)`;
  const s = (B.subs || []).filter(x => t >= x.t && t < x.e).pop();
  subEl.textContent = s ? s.text : ""; subEl.parentElement.style.opacity = s ? 1 : 0;
}

window.render = function (t) {
  const b = B;
  // 1) Varaq buklanadi → bola paydo bo'ladi
  const f1 = eio(lin(t, b.fold0, b.fold0 + 0.7)), f2 = ease(lin(t, b.fold0 + 0.6, b.fold0 + 1.2));
  halfB.rotation.y = -f1 * Math.PI * 0.98;
  sheet.scale.setScalar(1 - f2); sheet.rotation.z = f2 * 1.2;
  sheet.visible = f2 < 1;
  const pop = back(lin(t, b.fold0 + 0.9, b.fold0 + 1.5));
  // 2) Yurish: Claude uyidan Codex uyiga
  const walk = eio(lin(t, b.walk0, b.walk1));
  const bx = mix(-2.2, 2.4, walk);
  // 5) Uchib qaytish
  const fly = eio(lin(t, b.fly0, b.fly1));
  const flying = t >= b.fly0 && t < b.fly1 + 0.6;
  const home = ease(lin(t, b.fly1, b.fly1 + 0.6));
  let pos = V(bx, 0, 0.6), rotY = walk > 0 && walk < 1 ? Math.PI / 2 : 0;
  if (t >= b.code0) rotY = 1.1;                    // terminalga qaraydi
  if (t >= b.mem0) rotY = mix(1.1, -0.5, ease(lin(t, b.mem0, b.mem0 + 1)));  // orqaga qaraydi
  if (flying || t >= b.fly1) {
    const px = mix(2.4, -2.2, fly), py = 0.45 + Math.sin(fly * Math.PI) * 2.6;
    pos = V(px, mix(py, 0, home), 0.6 + Math.sin(fly * Math.PI) * 0.8);
    rotY = t >= b.fly1 ? mix(-Math.PI / 2, 0.2, home) : -Math.PI / 2;
  }
  boy.position.copy(pos); boy.rotation.y = rotY;
  boy.scale.setScalar(Math.max(0.001, pop));
  const step = walk > 0 && walk < 1 ? Math.sin(t * 14) : 0;
  legL.rotation.x = step * 0.6; legR.rotation.x = -step * 0.6; armL.rotation.x = -step * 0.5; armR.rotation.x = step * 0.5;
  boy.position.y += Math.abs(step) * 0.05;
  // yozish (Codex)
  const typing = t >= b.code0 && t < b.mem0;
  if (typing) { armL.rotation.x = -1.2 + Math.sin(t * 22) * 0.15; armR.rotation.x = -1.2 + Math.cos(t * 22) * 0.15; }
  // 3) Codex: kod chiziqlari uchadi
  strips.forEach((s, i) => {
    const ph = ((t - b.code0) * 0.7 + i / strips.length) % 1;
    const on = t >= b.code0 && t < b.mem0 + 0.5;
    s.visible = on;
    const base = codexTerm.position;
    s.position.set(base.x + Math.sin(i * 2.1) * 0.6, 1.6 + ph * 2.2, base.z + Math.cos(i * 1.7) * 0.3);
    s.rotation.set(ph * 3 + i, ph * 2, 0); s.scale.setScalar(Math.sin(ph * Math.PI) * (on ? 1 : 0) + 0.001);
  });
  // 4) Xotira kartochkalari: chapdan uchib keladi, bola atrofida aylanadi, 5) samolyotga yig'iladi
  cards.forEach((c, i) => {
    const s0 = b.mem0 + 0.4 + i * 1.6;
    const inP = ease(lin(t, s0, s0 + 1.2));
    const ang = (t - s0) * 0.6 + i * 2.1;
    const orbit = V(boy.position.x + Math.cos(ang) * 0.95, 1.45 + i * 0.32 + Math.sin(t * 1.5 + i) * 0.08, 0.6 + Math.sin(ang) * 0.7);
    const from = V(-6, 2.5 + i * 0.4, 1);
    const p = from.clone().lerp(orbit, inP);
    const gather = eio(lin(t, b.fold1 - 0.6, b.fold1));
    p.lerp(V(boy.position.x, 0.9, 1.2), gather);
    c.position.copy(p); c.lookAt(cam.position);
    c.scale.setScalar((1 - gather) * (t >= s0 ? 1 : 0) + 0.0001);
  });
  // samolyot
  const pl = back(lin(t, b.fold1 - 0.1, b.fold1 + 0.5));
  plane.visible = t >= b.fold1 - 0.1 && home < 1;
  plane.scale.setScalar(Math.max(0.001, pl) * 0.9);
  plane.position.set(boy.position.x, boy.position.y - 0.05, boy.position.z);
  plane.rotation.set(Math.sin(t * 3) * 0.08, flying ? -Math.PI / 2 : 0, Math.sin(t * 2) * 0.12);
  if (t >= b.fold1 && t < b.fly0) boy.position.y += 0.1;
  // 6) Claude terminali yonadi
  const tOn = ease(lin(t, b.end0, b.end0 + 0.6));
  claudeTerm.scale.setScalar(0.6 + 0.4 * tOn); claudeTerm.visible = t >= b.fly1;
  codexTerm.visible = t >= b.code0 - 0.6;
  codexTerm.scale.setScalar(Math.max(0.001, back(lin(t, b.code0 - 0.6, b.code0))));

  // Kamera: har sahnaga yumshoq o'tish
  const shots = b.shots || [];
  let k = 0; while (k < shots.length - 1 && t >= shots[k + 1].t) k++;
  const prev = shots[Math.max(0, k - 1)], cur = shots[k];
  const p = k === 0 ? 1 : eio(lin(t, cur.t, cur.t + (cur.blend || 1.2)));
  const follow = o => (o.follow ? V(boy.position.x * o.follow, 0, 0) : V(0, 0, 0));
  const posC = V(...prev.pos).add(follow(prev)).lerp(V(...cur.pos).add(follow(cur)), p);
  const look = V(...prev.look).add(follow(prev)).lerp(V(...cur.look).add(follow(cur)), p);
  cam.position.copy(posC); cam.lookAt(look);
  caption(t);
  renderer.render(scene, cam);
};
window.ready = document.fonts.ready.then(() => true);
</script></body></html>
