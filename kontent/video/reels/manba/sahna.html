<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caprasimo&family=Figtree:wght@500;700;800;900&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600;700&display=swap">
<style>

*{box-sizing:border-box}html,body{margin:0}
body{width:1080px;height:1920px;overflow:hidden;background:var(--cream);font-family:Figtree,sans-serif;color:var(--dark);position:relative}
canvas#bg{position:absolute;inset:0}

.hl{font-family:Anton,sans-serif;text-transform:uppercase;line-height:.95;font-size:150px;color:var(--navy);white-space:nowrap}
.hl.acc{color:var(--acc)}.hl.sm{font-size:92px}.hl.it{font-family:'Instrument Serif',serif;font-style:italic;text-transform:none;font-size:120px;color:var(--acc)}
#vis{position:absolute;left:0;right:0;top:600px;height:820px;z-index:3}
#cap{position:absolute;left:70px;right:70px;top:1490px;min-height:150px;display:flex;justify-content:center;align-items:flex-start;z-index:6}
.capbox{background:rgba(32,30,29,.92);color:#f5ead8;font-weight:800;font-size:50px;line-height:1.22;padding:20px 34px;border-radius:26px;text-align:center;max-width:940px}
.capbox b{color:#f6a06b}
.v{position:absolute;inset:0}
.phone{position:absolute;left:50%;top:50%;width:470px;height:800px;margin:-400px 0 0 -235px;border-radius:64px;background:#1b1a19;padding:16px;box-shadow:0 40px 90px rgba(32,30,29,.35)}
.screen{width:100%;height:100%;border-radius:50px;background:#fff;overflow:hidden;position:relative;font-family:Inter,sans-serif}

.x{position:absolute;width:120px;height:120px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;font-size:80px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 #8d2b22}
.ok{background:var(--green);box-shadow:0 10px 0 #24573a}
</style></head><body>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="top"><div class="brand"><img id="logo">AHdigital</div><div class="tag" id="tag"></div></div>
<div id="head"></div>
<div id="vis"></div>
<div id="cap"></div>
<script>
// ===== umumiy =====
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lin = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.7; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = id => document.getElementById(id);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const h = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; };
let SPEC, CT = [];        // CT[i] = i-bo'lak boshlanish vaqti (s)
const at = i => CT[Math.min(i, CT.length - 1)];

// ===== fon =====
const bg = $("bg").getContext("2d");
function drawBg(t) {
  bg.fillStyle = "#f5ead8"; bg.fillRect(0, 0, 1080, 1920);
  bg.save(); bg.strokeStyle = "#c67139"; bg.globalAlpha = .12; bg.lineWidth = 2;
  const off = (t * 18) % 90;
  for (let x = -90; x < 1170; x += 90) { bg.beginPath(); bg.moveTo(x + off, 0); bg.lineTo(x + off, 1920); bg.stroke(); }
  for (let y = -90; y < 2010; y += 90) { bg.beginPath(); bg.moveTo(0, y + off); bg.lineTo(1080, y + off); bg.stroke(); }
  bg.globalAlpha = .9; bg.fillStyle = "#ffc6a5"; bg.beginPath(); bg.arc(1010 + Math.sin(t * .5) * 20, 330, 230, 0, 7); bg.fill();
  bg.fillStyle = "#ccdbb2"; bg.beginPath(); bg.arc(60, 1700 + Math.cos(t * .4) * 20, 200, 0, 7); bg.fill();
  bg.restore();
}

// ===== sarlavha (kinetik) =====
let curHead = -1;
function headline(t) {
  let idx = -1; SPEC.heads.forEach((s, i) => { if (t >= at(s.at) - .05) idx = i; });
  const box = $("head");
  if (idx !== curHead) { curHead = idx; box.innerHTML = ""; if (idx >= 0) SPEC.heads[idx].lines.forEach(l => { const d = document.createElement("div"); d.className = "hl " + (l[1] || ""); d.textContent = l[0]; box.appendChild(d); }); }
  if (idx < 0) return;
  const s0 = at(SPEC.heads[idx].at) - .05, u = t - s0;
  [...box.children].forEach((d, i) => {
    const p = back(lin(u, i * .09, i * .09 + .38));
    const w = d.scrollWidth, sc = Math.min(1, 940 / Math.max(w, 1));
    d.style.transform = `translateY(${(1 - p) * 60}px) scale(${sc * (.6 + .4 * p)})`;
    d.style.opacity = cl(p * 1.4);
  });
}

// ===== subtitr =====
function caption(t) {
  let i = -1; CT.forEach((s, k) => { if (t >= s) i = k; });
  const box = $("cap");
  if (i < 0 || t > SPEC.speechEnd + .3) { box.innerHTML = ""; return; }
  const c = SPEC.chunks[i].c, words = c.split(" ");
  const s = CT[i], e = i + 1 < CT.length ? CT[i + 1] : SPEC.speechEnd;
  const p = lin(t, s, e - .1), total = c.length;
  let acc = 0; const html = words.map(w => { const a = acc / total; acc += w.length + 1; return a <= p ? `<b>${w}</b>` : w; }).join(" ");
  box.innerHTML = `<div class="capbox">${html}</div>`;
  const k = eo(lin(t, s, s + .18));
  box.firstChild.style.transform = `translateY(${(1 - k) * 18}px) scale(${.96 + .04 * k})`;
}

// ===== vizual kutubxona =====
const V = {};
let curGrp = -1, visEl = null;
// Ketma-ket bir xil vizual (masalan, bitta telefon) — bitta guruh: qayta yaratilmaydi, faqat holati o'zgaradi
function groupOf(i) { let g = i; while (g > 0 && SPEC.vis[g].keep && SPEC.vis[g - 1].v === SPEC.vis[g].v) g--; return g; }
function visual(t) {
  let idx = -1; SPEC.vis.forEach((s, i) => { if (t >= at(s.at) - .1) idx = i; });
  if (idx < 0) return;
  const g = groupOf(idx);
  if (g !== curGrp) {
    curGrp = g; const host = $("vis"); host.innerHTML = "";
    visEl = document.createElement("div"); visEl.className = "v"; host.appendChild(visEl); V[SPEC.vis[idx].v].init(visEl, SPEC.vis[idx]);
  }
  const sc = SPEC.vis[idx], s0 = at(SPEC.vis[g].at) - .1, u = t - s0;
  let e = idx + 1; while (e < SPEC.vis.length && SPEC.vis[e].keep && SPEC.vis[e].v === sc.v) e++;
  const next = SPEC.vis[e];
  const inP = eo(lin(u, 0, .45));
  const outP = next ? eio(lin(t, at(next.at) - .35, at(next.at) - .1)) : eio(lin(t, SPEC.end - .4, SPEC.end));
  visEl.style.opacity = cl(inP * 1.5) * (1 - outP);
  visEl.style.transform = `translateY(${(1 - inP) * 120 - outP * 80}px) scale(${(.92 + .08 * inP - .05 * outP) * 1.1})`;
  V[sc.v].draw(visEl, t - (at(sc.at) - .1), t, sc);
}

// --- Instagram profil (1-video): narx, tugma, havola holatlari
V.ig = {
  init(el, sc) {
    el.appendChild(h(`<div class="phone"><div class="screen" style="padding:60px 34px">
      <div style="display:flex;align-items:center;gap:26px"><div style="width:130px;height:130px;border-radius:50%;background:conic-gradient(#f58529,#dd2a7b,#8134af,#f58529);padding:6px"><div style="width:100%;height:100%;border-radius:50%;background:#c67139;display:flex;align-items:center;justify-content:center;font-size:60px">☕</div></div>
      <div style="display:flex;gap:26px;text-align:center;font-size:24px"><div><b style="font-size:32px">48</b><br>post</div><div><b style="font-size:32px">2,1K</b><br>obunachi</div><div><b style="font-size:32px">180</b><br>obuna</div></div></div>
      <div style="margin-top:24px;font-weight:700;font-size:30px">Lazzat kafe (namuna)</div>
      <div style="font-size:26px;color:#444;margin-top:6px">Milliy taomlar · Toshkent</div>
      <div id="igPrice" style="margin-top:12px;font-size:28px;font-weight:700;height:44px"></div>
      <div id="igLink" style="font-size:27px;color:#1d5fd1;font-weight:600;height:40px"></div>
      <div id="igBtns" style="display:flex;gap:12px;margin-top:16px"><div style="flex:1;background:#efefef;border-radius:14px;padding:16px;text-align:center;font-weight:700;font-size:26px">Obuna</div><div style="flex:1;background:#efefef;border-radius:14px;padding:16px;text-align:center;font-weight:700;font-size:26px">Xabar</div></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:22px">${Array.from({ length: 6 }, (_, i) => `<div style="aspect-ratio:1;background:${["#e8c8a8", "#c67139", "#f0dcc4", "#8e4a22", "#e7b48a", "#d9a173"][i]}"></div>`).join("")}</div>
    </div></div>`));
    el.appendChild(h(`<div id="igX" class="x" style="left:690px;top:120px">✕</div>`));
  },
  draw(el, u, t, sc) {
    const st = sc.st;       // [narx chiqish, tugma chiqish, havola chiqish] — bo'lak indekslari
    const price = el.querySelector("#igPrice"), link = el.querySelector("#igLink"), btns = el.querySelector("#igBtns"), x = el.querySelector("#igX");
    const hasP = t >= at(st[0]), hasB = t >= at(st[1]), hasL = t >= at(st[2]);
    price.innerHTML = hasP ? `<span class="pill" style="background:#fff2eb;color:#c67139;padding:6px 16px;transform:scale(${back(lin(t, at(st[0]), at(st[0]) + .4))});display:inline-block">💰 Narx: 35 000 so'mdan</span>` : `<span style="color:#bbb">— narx yo'q —</span>`;
    link.innerHTML = hasL ? `<span style="display:inline-block;transform:scale(${back(lin(t, at(st[2]), at(st[2]) + .4))})">🔗 ah-digital.uz/lazzat</span>` : `<span style="color:#bbb">— havola yo'q —</span>`;
    if (hasB && btns.childElementCount < 3) btns.appendChild(h(`<div style="flex:1;background:#c67139;color:#fff;border-radius:14px;padding:16px;text-align:center;font-weight:800;font-size:26px">📞 Qo'ng'iroq</div>`));
    if (hasB) btns.lastChild.style.transform = `scale(${back(lin(t, at(st[1]), at(st[1]) + .4))})`;
    // qizil X — hozirgi muammo joyida; tuzatilgach yashil ✓
    const marks = [[0, 320], [1, 470], [2, 370]]; let cur = sc.focus;
    const ys = { 0: 345, 1: 455, 2: 395 };
    if (cur == null) { x.style.display = "none"; return; }
    x.style.display = "flex";
    const fixed = t >= at(st[cur]);
    x.className = "x" + (fixed ? " ok" : ""); x.textContent = fixed ? "✓" : "✕";
    x.style.top = ys[cur] + "px";
    x.style.transform = `scale(${back(lin(u, .3, .7)) * (1 + .1 * Math.sin(t * 8) * (fixed ? 0 : 1))})`;
  }
};
// --- Katta "3 ta XATO" kartochkalari (hook)
V.badges = {
  init(el, sc) { sc.items.forEach((it, i) => el.appendChild(h(`<div class="card" style="left:${110 + i * 300}px;top:220px;width:260px;height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center"><div style="font-size:110px">${it[0]}</div><div style="font-weight:900;font-size:38px;line-height:1.1;padding:0 14px">${it[1]}</div></div>`))); },
  draw(el, u) { [...el.children].forEach((c, i) => { const p = back(lin(u, .15 + i * .18, .55 + i * .18)); c.style.transform = `translateY(${(1 - p) * 200}px) rotate(${(i - 1) * 5 * p}deg) scale(${p})`; }); }
};
// --- Google qidiruv + bilim kartasi
V.google = {
  init(el) {
    el.appendChild(h(`<div class="card" style="left:90px;top:20px;width:900px;height:120px;display:flex;align-items:center;gap:24px;padding:0 40px;font-size:44px;font-family:Inter"><span style="font-weight:700;font-size:48px"><span style="color:#4285f4">G</span><span style="color:#ea4335">o</span><span style="color:#fbbc05">o</span><span style="color:#4285f4">g</span><span style="color:#34a853">l</span><span style="color:#ea4335">e</span></span><span id="gq" style="flex:1;border-left:3px solid #ddd;padding-left:24px"></span>🔍</div>`));
    el.appendChild(h(`<div id="gcard" class="card" style="left:150px;top:190px;width:780px;padding:44px 50px;font-family:Inter">
      <div style="font-size:58px;font-weight:700">AHdigital <span style="color:#1a73e8;font-size:44px">✔</span></div>
      <div style="font-size:32px;color:#666;margin-top:6px">Vebsaytlar dizayneri · Toshkent</div>
      <div style="display:flex;gap:16px;margin:28px 0"><span class="pill" style="border:3px solid #dadce0;padding:12px 26px;font-size:30px;color:#1a73e8">🌐 Sayt</span><span class="pill" style="border:3px solid #dadce0;padding:12px 26px;font-size:30px;color:#1a73e8">📞 Qo'ng'iroq</span></div>
      <div class="gl" style="font-size:32px;margin:14px 0"><b>Telefon:</b> <span style="color:#1a73e8">95 632 29 05</span></div>
      <div class="gl" style="font-size:32px;margin:14px 0"><b>Ish vaqti:</b> 9:00–23:00</div>
      <div class="gl" style="font-size:32px;margin:14px 0"><b>Sayt:</b> <span style="color:#1a73e8">ah-digital.uz</span></div>
      <div class="gl" style="font-size:40px;margin-top:18px;color:#fbbc05">★★★★★ <span style="font-size:28px;color:#666">sharhlar</span></div></div>`));
  },
  draw(el, u, t, sc) {
    const q = "AHdigital", n = Math.floor(cl((u - .2) / .7) * q.length);
    el.querySelector("#gq").textContent = q.slice(0, n) + (u < 1.2 && Math.floor(t * 3) % 2 ? "|" : "");
    const c = el.querySelector("#gcard"), p = back(lin(t, at(sc.card), at(sc.card) + .5));
    c.style.transform = `translateY(${(1 - p) * 120}px) scale(${.85 + .15 * p})`; c.style.opacity = cl(p * 1.5);
    el.querySelectorAll(".gl").forEach((g, i) => { const k = eo(lin(t, at(sc.card) + .3 + i * .25, at(sc.card) + .6 + i * .25)); g.style.opacity = k; g.style.transform = `translateX(${(1 - k) * 40}px)`; });
  }
};
// --- Raqamli qadamlar ro'yxati
V.steps = {
  init(el, sc) { sc.items.forEach((it, i) => el.appendChild(h(`<div class="card" style="left:110px;top:${40 + i * 200}px;width:860px;height:160px;display:flex;align-items:center;gap:34px;padding:0 40px"><div style="flex:none;width:96px;height:96px;border-radius:50%;background:#c67139;color:#fff;font-family:Caprasimo;font-size:56px;display:flex;align-items:center;justify-content:center">${i + 1}</div><div style="font-weight:800;font-size:44px;line-height:1.15">${it[1]}</div><div style="margin-left:auto;font-size:70px">${it[2] || ""}</div></div>`))); },
  draw(el, u, t, sc) { [...el.children].forEach((c, i) => { const s = sc.items[i][0] != null ? at(sc.items[i][0]) : at(sc.at) + i * .4; const p = back(lin(t, s, s + .45)); c.style.opacity = cl(p * 1.5); c.style.transform = `translateX(${(1 - p) * -260}px)`; }); }
};
// --- Katta muhr / ikonka / matn (BEPUL, ⭐, 🔖 va h.k.)
V.stamp = {
  init(el, sc) { el.appendChild(h(`<div class="c" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center"><div style="font-size:${sc.size || 260}px;line-height:1">${sc.icon}</div>${sc.text ? `<div style="margin-top:30px;display:inline-block;background:${sc.bg || "#c67139"};color:#fff;font-weight:900;font-size:${sc.fs || 70}px;padding:18px 48px;border-radius:999px">${sc.text}</div>` : ""}${sc.sub ? `<div style="margin-top:26px;font-weight:800;font-size:46px;color:#26283a">${sc.sub}</div>` : ""}</div>`)); },
  draw(el, u, t) { const c = el.firstChild, p = back(lin(u, .1, .55)); c.style.transform = `translate(-50%,-50%) scale(${p * (1 + .03 * Math.sin(t * 4))}) rotate(${(1 - p) * -14}deg)`; }
};
// --- Yulduzlar (sharh)
V.stars = {
  init(el) { el.appendChild(h(`<div class="card" style="left:120px;top:120px;width:840px;padding:50px;text-align:center"><div id="st" style="font-size:120px;letter-spacing:10px"></div><div style="font-size:40px;font-weight:700;margin-top:20px;font-family:Inter">"Tez va sifatli ishlashdi!"</div><div style="font-size:30px;color:#777;margin-top:10px;font-family:Inter">— haqiqiy mijoz sharhi</div></div>`)); el.appendChild(h(`<div style="position:absolute;left:0;right:0;top:620px;text-align:center;font-family:Anton;font-size:110px;color:#3f8f5a">↑ YUQORIROQ</div>`)); },
  draw(el, u) { const n = Math.min(5, Math.floor(u / .18)); el.querySelector("#st").innerHTML = "<span style='color:#fbbc05'>" + "★".repeat(n) + "</span><span style='color:#ddd'>" + "★".repeat(5 - n) + "</span>"; const a = el.children[1], p = back(lin(u, 1.1, 1.5)); a.style.transform = `translateY(${(1 - p) * 80}px) scale(${p})`; a.style.opacity = cl(p * 1.4); }
};
// --- Qog'oz menyu → narx eskiradi
V.paper = {
  init(el) { el.appendChild(h(`<div class="card" style="left:240px;top:60px;width:600px;height:720px;background:#fffaf0;padding:60px;font-family:'Instrument Serif',serif;transform:rotate(-4deg)"><div style="text-align:center;font-size:76px;font-style:italic">Menyu</div>${[["Osh", "35 000"], ["Lag'mon", "30 000"], ["Somsa", "8 000"], ["Shashlik", "18 000"]].map(r => `<div style="display:flex;justify-content:space-between;font-size:56px;margin-top:40px;border-bottom:2px dotted #b9ae9c"><span>${r[0]}</span><span class="pp">${r[1]}</span></div>`).join("")}<div style="position:absolute;left:40px;right:40px;top:300px;height:6px;background:#d94b3d;transform:rotate(-12deg);display:none" class="slash"></div></div>`)); el.appendChild(h(`<div class="x" style="left:780px;top:20px">?</div>`)); },
  draw(el, u) { const p = back(lin(u, .5, .9)); el.querySelector(".x").style.transform = `scale(${p}) rotate(${Math.sin(u * 6) * 8}deg)`; el.querySelectorAll(".pp").forEach((s, i) => { s.style.textDecoration = u > 1 + i * .15 ? "line-through" : "none"; s.style.color = u > 1 + i * .15 ? "#d94b3d" : ""; }); }
};
// --- Narx yangilanishi (QR menyu, printer kerak emas)

        <div style="width:62px;height:62px;border-radius:50%;background:${sms ? "#8e8e93" : (sc.abg || "#2fa36b")};display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff">${sms ? "🏦" : (sc.avatar || "🛡")}</div>
        <div><div style="font-weight:700;font-size:28px;color:${sms ? "#111" : "#fff"}">${sms ? "BANK-INFO" : (sc.name || "Tekshir Bot")}</div><div style="font-size:21px;color:${sms ? "#8e8e93" : "#6d7f8f"}">${sms ? "SMS" : (sc.sub || "bot")}</div></div></div>
      <div id="tgb" style="flex:1;padding:18px 14px;display:flex;flex-direction:column;gap:12px"></div></div></div>`));
    const box = el.querySelector("#tgb");
    box.appendChild(h(`<div id="tgm" style="${sms ? "align-self:flex-start;background:#e5e5ea;color:#111;border-radius:26px 26px 26px 8px" : "align-self:flex-end;background:#2b5278;color:#fff;border-radius:26px 26px 8px 26px"};max-width:90%;padding:14px 18px;font-size:22px;line-height:1.32">${sms || sc.plain ? "" : `<div style="font-size:19px;color:#8fc3ff;margin-bottom:6px">↪ Uzatilgan xabar</div>`}${sc.msg}</div>`));
    if (!sms) {
      box.appendChild(h(`<div id="tgt" style="align-self:flex-start;color:#6d7f8f;font-size:22px;padding-left:8px">${sc.typing || "Tekshir yozmoqda…"}</div>`));
      box.appendChild(h(`<div id="tgr" style="align-self:flex-start;background:#182533;border:1px solid #2b3a48;color:#fff;border-radius:26px 26px 26px 8px;max-width:94%;padding:14px 18px;font-size:21px;line-height:1.36">${sc.reply}</div>`));
    }
  },
  draw(el, u, t, sc) {
    const m = el.querySelector("#tgm"), p = back(lin(u, .2, .6));
    m.style.opacity = cl(p * 1.5); m.style.transform = `translateY(${(1 - p) * 40}px) scale(${.9 + .1 * p})`;
    const hlOn = sc.hl != null && t >= at(sc.hl);
    el.querySelectorAll(".mk").forEach(x => { x.style.background = hlOn ? "rgba(217,75,61,.9)" : "transparent"; x.style.color = hlOn ? "#fff" : ""; x.style.borderRadius = "8px"; x.style.padding = "0 4px"; x.style.transform = `scale(${hlOn ? 1 + .12 * Math.max(0, 1 - (t - at(sc.hl)) * 3) : 1})`; x.style.display = "inline-block"; });
    if (sc.mode === "sms") return;
    const rs = sc.replyAt != null ? at(sc.replyAt) : at(sc.at) + 1.4;
    const ty = el.querySelector("#tgt"), r = el.querySelector("#tgr");
    ty.style.display = t > at(sc.at) + .7 && t < rs ? "block" : "none";
    const q = back(lin(t, rs, rs + .45));
    r.style.display = t >= rs ? "block" : "none"; r.style.transform = `translateY(${(1 - q) * 40}px) scale(${.9 + .1 * q})`; r.style.opacity = cl(q * 1.5);
    r.querySelectorAll(".ln").forEach((l, i) => { const k = eo(lin(t, rs + .3 + i * .22, rs + .6 + i * .22)); l.style.opacity = k; l.style.transform = `translateX(${(1 - k) * 24}px)`; });
  }
};
