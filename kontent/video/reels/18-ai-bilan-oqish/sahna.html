<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:F;font-weight:800;src:url(/f/Figtree-800.ttf)}
@font-face{font-family:F;font-weight:600;src:url(/f/Figtree-600.ttf)}
@font-face{font-family:C;src:url(/f/Caprasimo.ttf)}
html,body{margin:0;background:#fbf8ef}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Reels 18 — «AI'ga uy vazifangni yozdirma». window.render(t) — har bir kadr faqat vaqtga bog'liq (deterministik).
const cv = document.getElementById("c"), g = cv.getContext("2d");
const W = 1080, H = 1920;
const COL = { paper: "#fbf8ef", grid: "#dfe6f3", margin: "#f3a9a9", ink: "#1d2340", red: "#e5484d", yellow: "#ffd84d", blue: "#3d7bfd", green: "#1fae67", pink: "#ff8fc0", soft: "#eef1f7", white: "#ffffff", orange: "#ff9f43" };
let B = null, T = null, SUBS = [];
window.setBeats = b => { B = b; T = b.t; SUBS = b.subs; };

// ---------- yordamchilar ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const eIn = x => x * x * x;
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function font(px, w = 800, fam = "F") { g.font = `${w} ${px}px ${fam}, "Noto Color Emoji", sans-serif`; }
function text(s, x, y, px, col, w = 800, fam = "F", align = "center") { font(px, w, fam); g.fillStyle = col; g.textAlign = align; g.textBaseline = "middle"; g.fillText(s, x, y); }
function wrap(s, maxW) { const out = []; let line = ""; for (const w of s.split(" ")) { const tst = line ? line + " " + w : w; if (g.measureText(tst).width > maxW && line) { out.push(line); line = w; } else line = tst; } if (line) out.push(line); return out; }
// «Neo-brutal» stiker: qora soya + qalin chegara
function sticker(cx, cy, w, h, fill, rot, scale, draw, r = 26) {
  if (scale <= 0.001) return;
  g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(scale, scale);
  rr(-w / 2 + 10, -h / 2 + 12, w, h, r); g.fillStyle = COL.ink; g.fill();
  rr(-w / 2, -h / 2, w, h, r); g.fillStyle = fill; g.fill(); g.lineWidth = 6; g.strokeStyle = COL.ink; g.stroke();
  draw(); g.restore();
}
function popScale(t, a, d = 0.35) { const p = prog(t, a, d); return p <= 0 ? 0 : eBack(p); }
// deterministik tasodif
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ---------- fon: katak daftar ----------
function paper(t) {
  g.fillStyle = COL.paper; g.fillRect(0, 0, W, H);
  g.strokeStyle = COL.grid; g.lineWidth = 2;
  const off = (t * 6) % 54;
  for (let x = -54 + off; x < W; x += 54) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 54) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.strokeStyle = COL.margin; g.lineWidth = 4; g.beginPath(); g.moveTo(96, 0); g.lineTo(96, H); g.stroke();
  // brend
  rr(126, 226, 230, 62, 31); g.fillStyle = COL.ink; g.fill();
  text("AHdigital", 241, 258, 34, COL.paper);
}

// ---------- «Uy vazifasi» daftari ----------
function notebook(cx, cy, rot, s, rip = 0) {
  const w = 560, h = 720;
  g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(s, s);
  const half = side => {
    g.save();
    if (rip > 0) { g.translate(side * rip * 140, rip * rip * 900); g.rotate(side * rip * 0.5); }
    g.beginPath();
    // yirtiq chiziq
    const zig = []; for (let i = 0; i <= 14; i++) zig.push([(i % 2 ? 18 : -18) * (rip > 0 ? 1 : 0), -h / 2 + i * h / 14]);
    if (side < 0) { g.moveTo(-w / 2 - 20, -h / 2 - 20); zig.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(-w / 2 - 20, h / 2 + 20); }
    else { g.moveTo(w / 2 + 30, -h / 2 - 20); zig.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(w / 2 + 30, h / 2 + 30); }
    g.closePath(); g.clip();
    rr(-w / 2 + 12, -h / 2 + 14, w, h, 22); g.fillStyle = COL.ink; g.fill();
    rr(-w / 2, -h / 2, w, h, 22); g.fillStyle = "#4f7cff"; g.fill(); g.lineWidth = 7; g.strokeStyle = COL.ink; g.stroke();
    rr(-w / 2 + 60, -h / 2 + 110, w - 120, 190, 16); g.fillStyle = COL.white; g.fill(); g.stroke();
    text("UY VAZIFASI", 0, -h / 2 + 175, 62, COL.ink, 400, "C");
    text("Matematika · 5-sinf", 0, -h / 2 + 245, 36, "#6b7280", 600);
    for (let i = 0; i < 4; i++) { rr(-w / 2 + 70, 40 + i * 70, w - 140, 14, 7); g.fillStyle = "rgba(255,255,255,.55)"; g.fill(); }
    g.restore();
  };
  half(-1); half(1);
  g.restore();
}

// ---------- telefon + chat ----------
const PH = { x: 150, y: 470, w: 780, h: 860 };
function phone(t, a) {
  const e = eOut(prog(t, a, 0.4)), y = PH.y + (1 - e) * 1400;
  g.save(); g.translate(0, y - PH.y);
  rr(PH.x + 14, PH.y + 16, PH.w, PH.h, 70); g.fillStyle = COL.ink; g.fill();
  rr(PH.x, PH.y, PH.w, PH.h, 70); g.fillStyle = COL.ink; g.fill();
  rr(PH.x + 20, PH.y + 20, PH.w - 40, PH.h - 40, 52); g.fillStyle = COL.white; g.fill();
  rr(PH.x + 300, PH.y + 36, 180, 34, 17); g.fillStyle = COL.ink; g.fill();
  // sarlavha
  g.fillStyle = COL.soft; g.fillRect(PH.x + 20, PH.y + 90, PH.w - 40, 90);
  g.beginPath(); g.arc(PH.x + 90, PH.y + 135, 30, 0, 7); g.fillStyle = COL.ink; g.fill();
  text("AI", PH.x + 90, PH.y + 137, 30, COL.yellow);
  text("AI yordamchi", PH.x + 140, PH.y + 124, 38, COL.ink, 800, "F", "left");
  g.beginPath(); g.arc(PH.x + 150, PH.y + 156, 8, 0, 7); g.fillStyle = COL.green; g.fill();
  text("onlayn", PH.x + 166, PH.y + 157, 26, "#6b7280", 600, "F", "left");
  g.restore();
  return y - PH.y;
}
function bubble(t, side, y0, msg, a, typeEnd, dy, extraH = 0) {
  if (t < a) return 0;
  const shown = typeEnd ? msg.slice(0, Math.round(msg.length * prog(t, a, typeEnd - a))) : msg;
  font(42, 600); const lines = wrap(msg, 520), sl = wrap(shown || " ", 520);
  const bw = Math.min(600, Math.max(...lines.map(l => g.measureText(l).width)) + 60), bh = lines.length * 56 + 40 + extraH;
  const s = typeEnd ? 1 : eBack(prog(t, a, 0.3));
  const x = side > 0 ? PH.x + PH.w - 50 - bw : PH.x + 50, y = y0 + dy;
  g.save(); g.translate(x + (side > 0 ? bw : 0), y); g.scale(s, s); g.translate(-(x + (side > 0 ? bw : 0)), -y);
  rr(x, y, bw, bh, 34); g.fillStyle = side > 0 ? COL.blue : COL.soft; g.fill();
  sl.forEach((l, i) => text(l, x + 30, y + 48 + i * 56, 42, side > 0 ? COL.white : COL.ink, 600, "F", "left"));
  if (typeEnd && t < typeEnd + 0.15 && Math.floor(t * 4) % 2 === 0) { font(42, 600); const lw = g.measureText(sl[sl.length - 1]).width; g.fillStyle = COL.white; g.fillRect(x + 32 + lw, y + 24 + (sl.length - 1) * 56, 4, 46); }
  g.restore();
  return { x, y, bw, bh };
}

// ---------- tip sarlavhasi ----------
function tipHeader(t, a, num, line1, line2, col) {
  const s = popScale(t, a, 0.4);
  sticker(200, 380, 170, 170, col, -0.08, s, () => text(String(num), 0, 8, 130, COL.ink, 400, "C"), 85);
  const e = eOut(prog(t, a + 0.1, 0.35));
  g.globalAlpha = e;
  text(line1, 320 + (1 - e) * 60, 350, 58, COL.ink, 800, "F", "left");
  text(line2, 320 + (1 - e) * 60, 418, 58, COL.ink, 800, "F", "left");
  g.globalAlpha = 1;
}

// ---------- pitsa ----------
function pizza(cx, cy, r, out) {
  for (let k = 0; k < 4; k++) {
    const a0 = -Math.PI / 2 + k * Math.PI / 2, a1 = a0 + Math.PI / 2, mid = (a0 + a1) / 2;
    const o = k === 0 ? out : 0;
    g.save(); g.translate(Math.cos(mid) * o * 60, Math.sin(mid) * o * 60);
    g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, r, a0, a1); g.closePath();
    g.fillStyle = "#f0a64a"; g.fill(); g.lineWidth = 6; g.strokeStyle = COL.ink; g.stroke();
    g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, r - 22, a0 + 0.04, a1 - 0.04); g.closePath(); g.fillStyle = k === 0 && out > 0.5 ? "#ffe08a" : "#ffd36b"; g.fill();
    for (let p = 0; p < 2; p++) { const ang = a0 + (p + 0.6) * (Math.PI / 2) / 2.2, rr2 = r * (0.42 + p * 0.22); g.beginPath(); g.arc(cx + Math.cos(ang) * rr2, cy + Math.sin(ang) * rr2, 18, 0, 7); g.fillStyle = COL.red; g.fill(); }
    g.restore();
  }
}

// ---------- konfetti ----------
function confetti(t, a, cx, cy) {
  const p = t - a; if (p < 0 || p > 1.6) return;
  for (let i = 0; i < 60; i++) {
    const ang = rnd(i) * Math.PI * 2, sp = 500 + rnd(i + 9) * 700;
    const x = cx + Math.cos(ang) * sp * p, y = cy + Math.sin(ang) * sp * p + 900 * p * p;
    g.save(); g.translate(x, y); g.rotate(p * 8 + i); g.globalAlpha = clamp(1.6 - p);
    g.fillStyle = [COL.yellow, COL.pink, COL.blue, COL.green, COL.orange][i % 5]; g.fillRect(-10, -6, 20, 12); g.restore();
  }
}

// ---------- subtitrlar ----------
function captions(t) {
  const s = SUBS.find(x => t >= x.s - 0.05 && t <= x.e + 0.25); if (!s) return;
  font(60, 800); const words = s.w.map(w => w.t), widths = words.map(w => g.measureText(w).width), gap = 18;
  const total = widths.reduce((a, b) => a + b, 0) + gap * (words.length - 1);
  let x = W / 2 - total / 2; const y = 1440;
  rr(W / 2 - total / 2 - 34, y - 52, total + 68, 104, 52); g.fillStyle = COL.ink; g.fill();
  words.forEach((w, i) => {
    const on = t >= s.w[i].s - 0.03;
    if (t >= s.w[i].s - 0.03 && t <= s.w[i].e + 0.05) { rr(x - 10, y - 40, widths[i] + 20, 80, 16); g.fillStyle = COL.yellow; g.fill(); }
    text(w, x, y + 2, 60, t >= s.w[i].s - 0.03 && t <= s.w[i].e + 0.05 ? COL.ink : on ? COL.white : "rgba(255,255,255,.55)", 800, "F", "left");
    x += widths[i] + gap;
  });
}

// ---------- sahnalar ----------
function sceneHook(t) {
  // daftar → qo'l urildi → yirtildi → «YOZDIRMA!»
  const hand = prog(t, 0.05, 0.22), rip = prog(t, 0.36, 0.9);
  notebook(540, 860, -0.04, 1, eIn(rip));
  if (t > 0.05 && t < 1.6) {
    const y = -300 + eOut(hand) * 960, sc = 1 + (t > 0.27 && t < 0.4 ? 0.12 * Math.sin((t - 0.27) * 24) : 0);
    g.save(); g.globalAlpha = clamp((1.6 - t) / 0.4); g.translate(540, y); g.scale(sc, sc); text("✋", 0, 0, 380, COL.ink); g.restore();
  }
  // vibratsiya
  const sh = t > 0.27 && t < 0.6 ? Math.sin(t * 90) * 14 * (0.6 - t) / 0.33 : 0;
  const s1 = popScale(t, 0.72, 0.35), s2 = popScale(t, 1.86, 0.35);
  sticker(540 + sh, 560, 860, 150, COL.white, -0.03, s1, () => text("AI'ga uy vazifangni", 0, 10, 72, COL.ink, 400, "C"));
  sticker(540 - sh, 800, 900, 230, COL.red, 0.04, s2, () => text("YOZDIRMA!", 0, 12, 128, COL.white, 400, "C"));
}
function sceneIntro(t, a) {
  const s = popScale(t, a, 0.4);
  sticker(540, 560, 820, 170, COL.yellow, -0.03, s, () => text("3 ta aqlli usul", 0, 8, 92, COL.ink, 400, "C"));
  [3, 2, 1].forEach((n, i) => {
    const sc = popScale(t, a + 0.35 + i * 0.22, 0.35);
    sticker(300 + i * 240, 840, 170, 170, [COL.blue, COL.pink, COL.orange][i], (i - 1) * 0.08, sc, () => text(String(n), 0, 8, 120, COL.ink, 400, "C"), 85);
  });
  const fs = popScale(t, T.oxirgisi, 0.35), fl = 1 + 0.06 * Math.sin(t * 10);
  sticker(780, 1080, 520, 120, COL.ink, 0.06, fs * fl, () => text("Oxirgisi — eng kuchlisi 🔥", 0, 4, 44, COL.yellow));
  if (fs > 0) { g.save(); g.strokeStyle = COL.ink; g.lineWidth = 7; g.lineCap = "round"; g.globalAlpha = clamp(fs); g.beginPath(); g.moveTo(760, 1010); g.quadraticCurveTo(800, 960, 780, 935); g.stroke(); g.beginPath(); g.moveTo(760, 950); g.lineTo(780, 930); g.lineTo(802, 952); g.stroke(); g.restore(); }
}
function sceneTip3(t) {
  tipHeader(t, T.tip3, 3, "10 yoshli bolaga", "tushuntir", COL.blue);
  const dy = phone(t, T.tip3 + 0.15);
  bubble(t, 1, PH.y + 220, "Kasrlarni 10 yoshli bolaga tushuntir 🙏", T.type3a, T.type3b, dy);
  const b = bubble(t, -1, PH.y + 390, "Pitsani 4 bo'lakka bo'lamiz 🍕", T.ai3, 0, dy, 330);
  if (b) {
    const out = eBack(prog(t, T.pizza, 0.4));
    pizza(PH.x + 240, b.y + 260, 125, out);
    const ls = popScale(t, T.pizza + 0.45, 0.3);
    sticker(PH.x + 560, b.y + 260, 280, 120, COL.yellow, 0.06, ls, () => { text("1 bo'lak", 0, -20, 38, COL.ink); text("= 1/4", 0, 26, 46, COL.ink, 400, "C"); });
  }
}
function sceneTip2(t) {
  tipHeader(t, T.tip2, 2, "Menga imtihon", "ol", COL.pink);
  const dy = phone(t, T.tip2 + 0.15);
  bubble(t, 1, PH.y + 220, "Kasrlardan 5 ta savol ber, javobimni tekshir", T.type2a, T.type2b, dy);
  bubble(t, -1, PH.y + 480, "1-savol: 1/2 + 1/4 = ?", T.type2b + 0.25, 0, dy);
  // viktorina kartasi
  const q = eBack(prog(t, T.quiz, 0.4));
  if (q > 0) {
    g.fillStyle = `rgba(29,35,64,${0.55 * clamp(q)})`; g.fillRect(0, 0, W, H);
    sticker(540, 860, 900, 820, COL.yellow, -0.02, q, () => {
      text("SEN HAM JAVOB BER! 👇", 0, -320, 52, COL.ink);
      const ans = t >= T.answer;
      text(ans ? "1/2 + 1/4 = 3/4" : "1/2 + 1/4 = ?", 0, -170, ans ? 104 : 116, ans ? COL.green : COL.ink, 400, "C");
      // taymer
      const cy = 120, r = 150;
      g.beginPath(); g.arc(0, cy, r, 0, 7); g.fillStyle = COL.white; g.fill(); g.lineWidth = 8; g.strokeStyle = COL.ink; g.stroke();
      const pr = prog(t, T.n3, T.answer - T.n3);
      if (pr > 0 && !ans) { g.beginPath(); g.arc(0, cy, r - 22, -Math.PI / 2, -Math.PI / 2 + pr * Math.PI * 2); g.lineWidth = 26; g.strokeStyle = COL.red; g.lineCap = "round"; g.stroke(); }
      let n = t >= T.n1 ? "1" : t >= T.n2 ? "2" : t >= T.n3 ? "3" : "⏱";
      const na = t >= T.n1 ? T.n1 : t >= T.n2 ? T.n2 : T.n3;
      if (ans) { const s = eBack(prog(t, T.answer, 0.35)); g.save(); g.translate(0, cy); g.scale(s, s); text("✅", 0, 4, 170, COL.green); g.restore(); }
      else { const s = t >= T.n3 ? 0.7 + 0.3 * eBack(prog(t, na, 0.3)) : 1; g.save(); g.translate(0, cy); g.scale(s, s); text(n, 0, 10, n === "⏱" ? 110 : 160, COL.ink, 400, "C"); g.restore(); }
      text(ans ? "To'g'ri! Barakalla 🎉" : "Videoni to'xtat va o'yla 🤔", 0, 340, 46, COL.ink, 800);
    });
    confetti(t, T.answer, 540, 860);
  }
}
const ESSAY = [
  ["Kuz — mening sevimli faslim.", null],
  ["Barglar sarg'ayib to'kiladi.", null],
  ["Men kuzni juda yaxshi koraman.", ["koraman", "ko'raman"]],
  ["Havo salqin va yokimli.", ["yokimli", "yoqimli"]],
  ["Kuzda maktabga qaytamz.", ["qaytamz", "qaytamiz"]],
];
function sceneTip1(t) {
  tipHeader(t, T.tip1, 1, "Xatoni ko'rsat,", "lekin tuzatma", COL.orange);
  const fs = popScale(t, T.strong, 0.35), fl = 1 + 0.05 * Math.sin(t * 12);
  sticker(800, 250 + 0, 380, 90, COL.red, 0.05, fs * fl, () => text("ENG KUCHLISI 🔥", 0, 4, 42, COL.white));
  // insho varag'i
  const e = eOut(prog(t, T.tip1 + 0.15, 0.4)), oy = (1 - e) * 1300;
  const X = 140, Y = 520 + oy, Wd = 800, Hd = 800;
  rr(X + 14, Y + 16, Wd, Hd, 24); g.fillStyle = COL.ink; g.fill();
  rr(X, Y, Wd, Hd, 24); g.fillStyle = COL.white; g.fill(); g.lineWidth = 6; g.strokeStyle = COL.ink; g.stroke();
  text("Insho: «Kuz»", X + 60, Y + 80, 48, COL.ink, 800, "F", "left");
  for (let i = 0; i < 6; i++) { g.strokeStyle = "#c9d6f0"; g.lineWidth = 3; g.beginPath(); g.moveTo(X + 40, Y + 190 + i * 110); g.lineTo(X + Wd - 40, Y + 190 + i * 110); g.stroke(); }
  let errN = 0;
  ESSAY.forEach(([line, err], i) => {
    const ly = Y + 170 + i * 110, rev = prog(t, T.insho + i * 0.22, 0.4);
    if (rev <= 0) return;
    font(46, 600); const full = g.measureText(line).width;
    g.save(); g.beginPath(); g.rect(X + 50, ly - 50, 20 + full * rev, 100); g.clip();
    text(line, X + 60, ly, 46, "#2b3567", 600, "F", "left"); g.restore();
    if (!err) return;
    const k = errN++, pre = line.slice(0, line.indexOf(err[0])), px = X + 60 + g.measureText(pre).width, ew = g.measureText(err[0]).width;
    const m = prog(t, T.marks + k * 0.35, 0.3);
    if (m > 0) {   // qizil to'lqinli chiziq + doira
      g.save(); g.strokeStyle = COL.red; g.lineWidth = 6; g.beginPath();
      for (let x = 0; x <= ew * m; x += 6) g.lineTo(px + x, ly + 32 + Math.sin(x / 8) * 6); g.stroke();
      g.globalAlpha = clamp(m * 2); g.beginPath(); g.ellipse(px + ew / 2, ly, ew / 2 + 22, 42, -0.04, 0, Math.PI * 2 * m); g.stroke(); g.restore();
    }
    const f = prog(t, T.fix + k * 0.42, 0.35);
    if (f > 0) {   // bola o'zi tuzatadi
      g.strokeStyle = COL.ink; g.lineWidth = 6; g.beginPath(); g.moveTo(px - 4, ly); g.lineTo(px - 4 + (ew + 8) * clamp(f * 1.5), ly); g.stroke();
      g.save(); g.globalAlpha = clamp(f * 2 - 0.5); text(err[1], px + ew / 2, ly - 56, 40, COL.green, 800); g.restore();
      if (f > 0.6) { const pe = eOut(clamp((f - 0.6) / 0.4)); text("✏️", px + ew + 30 - 20 * (1 - pe), ly - 50, 60, COL.ink); }
    }
  });
  const ns = popScale(t, T.notfix, 0.35);
  sticker(560, Y + Hd - 60, 700, 120, COL.pink, -0.03, ns * (t < T.fix + 1.3 ? 1 : 0), () => text("3 ta xato topdim — o'zing tuzat 😉", 0, 4, 40, COL.ink));
  const ok = popScale(t, T.fix + 1.35, 0.35);
  sticker(560, Y + Hd - 60, 600, 120, COL.green, 0.03, ok, () => text("O'zing o'rganding! 💪", 0, 4, 48, COL.white));
}
function sceneCTA(t) {
  const s1 = popScale(t, T.save, 0.35), s2 = popScale(t, T.share, 0.35);
  sticker(540, 620, 760, 190, COL.yellow, -0.04, s1, () => text("🔖 SAQLAB QO'Y", 0, 8, 86, COL.ink, 400, "C"));
  sticker(540, 880, 860, 190, COL.blue, 0.03, s2, () => text("📤 Sinfdoshingga yubor", 0, 6, 68, COL.white));
  const s3 = eOut(prog(t, T.share + 0.3, 0.4));
  g.globalAlpha = s3;
  text("⚠️ AI ham xato qiladi — tekshir!", 540, 1090, 46, COL.red, 800);
  text("3 ta tayyor buyruq — Telegram: @ahdigital_01", 540, 1170, 38, COL.ink, 600);
  g.globalAlpha = 1;
}

// ---------- asosiy ----------
window.render = function (t) {
  paper(t);
  if (t < T.oxirgisi - 2.4) sceneHook(t);                       // 0 – «Mana»
  else if (t < T.tip3) sceneIntro(t, T.oxirgisi - 2.4);
  else if (t < T.tip2) sceneTip3(t);
  else if (t < T.tip1) sceneTip2(t);
  else if (t < T.save) sceneTip1(t);
  else if (t < T.loop) sceneCTA(t);
  else {
    // aylana: daftar markazga qaytadi — 0-kadr bilan bir xil holat
    const p = eOut(prog(t, T.loop, 0.6));
    g.save(); g.globalAlpha = 1 - p; sceneCTA(t); g.restore();
