<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>AI LEGENDS — kurs</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/legends.css">
</head>
<body>
<header class="lg-top">
  <a href="/" class="lg-brand"><img src="/images/logo.svg" alt="" width="34" height="34"><span>AI <b>LEGENDS</b></span></a>
  <button class="lg-out" id="logout" type="button" hidden>Chiqish</button>
</header>

<main class="lg-wrap" id="app">
  <p class="lg-muted">Yuklanmoqda…</p>
</main>

<!-- Dars oynasi -->
<div class="lesson" id="lesson" hidden role="dialog" aria-modal="true" aria-labelledby="lesson-title">
  <div class="lesson-bar">
    <button class="lg-btn ghost" id="lesson-back" type="button">← Darslar</button>
    <h2 id="lesson-title"></h2>
    <span class="lg-chip" id="lesson-timer"></span>
  </div>
  <div class="lesson-body">
    <div class="video" id="lesson-video"></div>
    <div class="deck" id="deck" tabindex="0" aria-roledescription="slaydlar">
      <div class="slide" id="slide" aria-live="polite"></div>
      <div class="deck-nav">
        <button class="lg-btn ghost" id="prev" type="button" aria-label="Oldingi slayd">←</button>
        <span id="counter"></span>
        <button class="lg-btn ghost" id="next" type="button" aria-label="Keyingi slayd">→</button>
        <button class="lg-btn ghost" id="full" type="button">⛶ To'liq ekran</button>
      </div>
    </div>
    <button class="lg-btn" id="done" type="button">✓ Darsni ko'rdim</button>
  </div>
</div>

<script src="/legends-app.js"></script>
</body>
</html>
