# Render.com uchun sozlama (Blueprint). Render bu faylni o'qib, saytni o'zi sozlaydi.
services:
  - type: web
    name: ahdigital
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_CHANNEL
        value: "@ahdigital_01"
      - key: CALLMEBOT_USER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
