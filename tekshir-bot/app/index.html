<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tekshir — firibgarlardan himoya</title>
<meta name="description" content="Shubhali SMS, havola, APK fayl yoki karta raqamini bir necha soniyada tekshiring. Bepul.">
<meta name="theme-color" content="#0a1020">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  /* Tekshir — xavfsizlik paneli uslubi: to'q fon, holat ranglari (yashil / sariq / qizil) */
  :root {
    --bg: #0a1020; --surface: #111a2e; --card: #16213a; --line: #24314f;
    --text: #e8eefc; --muted: #8b97b5; --accent: #38bdf8;
    --safe: #22c55e; --warn: #f5b301; --danger: #ef4444;
    --safe-bg: rgba(34,197,94,.12); --warn-bg: rgba(245,179,1,.12); --danger-bg: rgba(239,68,68,.13);
    --r: 20px; --nav: 64px;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100dvh; }
  main { max-width: 560px; margin: 0 auto; padding: calc(var(--st) + 16px) 16px calc(var(--nav) + var(--sb) + 28px); display: flex; flex-direction: column; gap: 16px; }
  h1, h2, p { margin: 0; } h2 { font-size: 18px; }
  .muted { color: var(--muted); font-size: 14px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .logo { width: 36px; height: 36px; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: .01em; flex: 1; }
  .pill { font-size: 12px; font-weight: 700; color: var(--safe); background: var(--safe-bg); border: 1px solid rgba(34,197,94,.35); padding: 4px 10px; border-radius: 99px; }

  /* Markaziy qalqon */
  .hero { position: relative; display: grid; place-items: center; padding: 18px 0 6px; }
  .ring { position: relative; width: 220px; height: 220px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 40%, rgba(56,189,248,.18), rgba(10,16,32,0) 65%); }
  .ring::before, .ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(34,197,94,.45); animation: pulse 2.6s ease-out infinite; }
  .ring::after { animation-delay: 1.3s; }
  @keyframes pulse { from { transform: scale(.72); opacity: .9; } to { transform: scale(1.12); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ring::before, .ring::after { animation: none; opacity: .4; } }
  .shield { width: 120px; height: 120px; filter: drop-shadow(0 10px 30px rgba(34,197,94,.35)); }
  .hero-t { text-align: center; margin-top: 4px; }
  .hero-t b { display: block; font-size: 22px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 22px; } .stat span { font-size: 12px; color: var(--muted); }

  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 18px; border: 0; width: 100%;
    background: linear-gradient(135deg, #22c55e, #16a34a); color: #04130a; font: 800 17px system-ui, sans-serif; cursor: pointer; text-decoration: none; }
  .btn:active { transform: scale(.98); } .btn[disabled] { opacity: .6; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); height: 48px; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; color: var(--text); text-decoration: none; text-align: left; font: inherit; cursor: pointer; }
  .tile .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: rgba(56,189,248,.12); }
  .tile b { font-size: 15px; } .tile span { font-size: 12px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .kicker { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }

  textarea { width: 100%; min-height: 140px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 16px/1.5 system-ui, sans-serif; padding: 14px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Natija */
  .res { border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; border: 2px solid; }
  .res.safe { background: var(--safe-bg); border-color: var(--safe); } .res.suspicious { background: var(--warn-bg); border-color: var(--warn); } .res.danger { background: var(--danger-bg); border-color: var(--danger); }
  .res-h { display: flex; align-items: center; gap: 12px; }
  .res-ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; flex: none; }
  .safe .res-ic { background: var(--safe); } .suspicious .res-ic { background: var(--warn); } .danger .res-ic { background: var(--danger); }
  .res-h b { font-size: 22px; }
  .res ul { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
  .res ul.plain { list-style: none; padding: 0; }
  .note { font-size: 13px; color: var(--muted); }
  .err { color: #fca5a5; font-weight: 600; }

  /* Tarix */
  .h-item { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .dot.safe { background: var(--safe); } .dot.suspicious { background: var(--warn); } .dot.danger { background: var(--danger); }
  .h-item p { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .h-item small { color: var(--muted); font-size: 12px; }
  .h-item > div { min-width: 0; flex: 1; }

  /* Maslahatlar */
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 38px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 700 14px system-ui, sans-serif; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* Pastki menyu */
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(10,16,32,.96); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + var(--sb)); backdrop-filter: blur(10px); }
  nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); height: var(--nav); }
  nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 700; border-radius: 14px; }
  nav a svg { width: 22px; height: 22px; }
  nav a[aria-current="page"] { color: var(--safe); background: var(--safe-bg); }
  .sel { display: flex; gap: 8px; } .sel button { flex: 1; }
  a.link { color: var(--accent); }
</style>
</head>
<body>
<main id="view" aria-live="polite"></main>

<nav aria-label="Menyu"><div class="in">
  <a href="#bosh" data-tab="bosh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg><span data-t="nav_home">Himoya</span></a>
  <a href="#tarix" data-tab="tarix"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-t="nav_hist">Tarix</span></a>
  <a href="#maslahat" data-tab="maslahat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg><span data-t="nav_tips">Maslahat</span></a>
  <a href="#haqida" data-tab="haqida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span data-t="nav_about">Haqida</span></a>
</div></nav>

<script src="/maslahatlar.js"></script>
<script>
// ================= Tekshir ilovasi =================
// Matn faqat tekshirish uchun serverga yuboriladi va saqlanmaydi. Fayl umuman yuborilmaydi — faqat nomi va SHA-256.
// Tarix FAQAT shu telefonda (localStorage) — raqamlar yashirilgan holda.
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* xotira yopiq bo'lsa ham ishlayveradi */ } } };

// Tillar: o'zbek (lotin) va rus. Natija matni serverdan shu tilda keladi.
const T = {
  uz: { nav_home: "Himoya", nav_hist: "Tarix", nav_tips: "Maslahat", nav_about: "Haqida", protected: "Himoyadasiz", hero_sub: "Shubhali xabarni tekshirmasdan ochmang", checked: "tekshirildi", dangers: "xavfli topildi", tips_n: "maslahat",
    check_btn: "🔍 Tekshirish", t_msg: "Xabar", t_msg_s: "SMS yoki Telegram", t_link: "Havola", t_link_s: "Sayt manzili", t_apk: "APK fayl", t_apk_s: "Ilova yoki hujjat", t_num: "Raqam", t_num_s: "Telefon yoki karta",
    tip_day: "💡 Kun maslahati", check_title: "Tekshirish", ph: "Shubhali xabar, havola yoki raqamni shu yerga qo'ying…", paste: "📋 Joylash", file: "📎 Fayl tanlash", checking: "Tekshirilmoqda…",
    why: "Nima uchun", todo: "Nima qilish kerak", nums: "Raqamlar", reports: "ta shikoyat", no_reports: "shikoyat yo'q", rep_note: "Shikoyatlar soni — foydalanuvchilar fikri, rasmiy xulosa emas.",
    privacy: "🔒 Xabaringiz saqlanmaydi. Fayl yuklanmaydi — faqat uning «barmoq izi» tekshiriladi. Natija 100% kafolat emas.", empty: "Avval xabar yoki havolani qo'ying.",
    net: "Internet bilan bog'lanib bo'lmadi. Qayta urinib ko'ring.", busy: "Juda tez yuboryapsiz — bir daqiqa kuting.", fail: "Hozir tekshirib bo'lmadi. Birozdan keyin urinib ko'ring.",
    paste_fail: "Matnni nusxalang, maydonni bosib turing va «Joylash» ni tanlang.", hist_title: "Tekshiruvlar tarixi", hist_empty: "Hali tekshiruv yo'q. Shubhali xabar kelsa — shu yerda ko'rinadi.", hist_note: "Tarix faqat shu telefonda saqlanadi. Raqamlar yashirilgan.", clear: "🗑 Tarixni tozalash", clear_q: "Tarix o'chirilsinmi?",
    all: "Barchasi", tips_title: "Maslahatlar", share_tips: "↗️ Oilamga ulashish", about_title: "Tekshir haqida",
    about_p: "Tekshir — firibgarlikka qarshi bepul ilova. Shubhali SMS, Telegram xabar, havola, APK fayl yoki karta raqamini tekshiradi va sodda tilda tushuntiradi.",
    how: "Qanday ishlaydi", how_1: "Xabarni nusxalab shu yerga qo'ying — yoki boshqa ilovada «Ulashish → Tekshir» ni bosing.", how_2: "Tekshir uni qoidalar, Google Safe Browsing va VirusTotal orqali tekshiradi.", how_3: "Natija: ✅ xavf topilmadi · 🟡 shubhali · 🔴 xavfli — sabablari va nima qilish kerakligi bilan.",
    lang: "Til", bot: "Telegram bot: @tekshirbot_bot", bot_s: "Guruhlarda ham ishlaydi", made: "AHdigital tomonidan yaratilgan", priv_title: "Maxfiylik",
    priv_p: "Xabar matni serverda saqlanmaydi — faqat natija (daraja va sabab kodi) statistika uchun. Telefon va karta raqamlari faqat shifrlangan ko'rinishda. Tarix faqat shu telefonda.",
    kind_msg: "Xabar", kind_file: "Fayl", ago_now: "hozir", share_text: "Firibgarlardan himoya: shubhali xabarni Tekshir ilovasida tekshiring 👇" },
  ru: { nav_home: "Защита", nav_hist: "История", nav_tips: "Советы", nav_about: "О нас", protected: "Вы под защитой", hero_sub: "Не открывайте подозрительное, не проверив", checked: "проверено", dangers: "опасных", tips_n: "советов",
    check_btn: "🔍 Проверить", t_msg: "Сообщение", t_msg_s: "SMS или Telegram", t_link: "Ссылка", t_link_s: "Адрес сайта", t_apk: "APK файл", t_apk_s: "Приложение или документ", t_num: "Номер", t_num_s: "Телефон или карта",
    tip_day: "💡 Совет дня", check_title: "Проверка", ph: "Вставьте подозрительное сообщение, ссылку или номер…", paste: "📋 Вставить", file: "📎 Выбрать файл", checking: "Проверяем…",
    why: "Почему", todo: "Что делать", nums: "Номера", reports: "жалоб", no_reports: "жалоб нет", rep_note: "Число жалоб — мнение пользователей, а не официальный вывод.",
    privacy: "🔒 Сообщение не сохраняется. Файл не загружается — проверяется только его «отпечаток». Результат не даёт 100% гарантии.", empty: "Сначала вставьте сообщение или ссылку.",
    net: "Нет связи с интернетом. Попробуйте ещё раз.", busy: "Слишком часто — подождите минуту.", fail: "Сейчас не получилось проверить. Попробуйте позже.",
    paste_fail: "Скопируйте текст, зажмите поле и выберите «Вставить».", hist_title: "История проверок", hist_empty: "Пока нет проверок.", hist_note: "История хранится только на этом телефоне. Номера скрыты.", clear: "🗑 Очистить историю", clear_q: "Удалить историю?",
    all: "Все", tips_title: "Советы", share_tips: "↗️ Поделиться с семьёй", about_title: "О приложении Tekshir",
    about_p: "Tekshir — бесплатное приложение против мошенников. Проверяет подозрительные SMS, сообщения, ссылки, APK-файлы и номера карт и объясняет простым языком.",
    how: "Как это работает", how_1: "Вставьте сообщение сюда — или нажмите «Поделиться → Tekshir» в другом приложении.", how_2: "Tekshir проверяет его по правилам, через Google Safe Browsing и VirusTotal.", how_3: "Результат: ✅ угроз нет · 🟡 подозрительно · 🔴 опасно — с причинами и советами.",
    lang: "Язык", bot: "Telegram-бот: @tekshirbot_bot", bot_s: "Работает и в группах", made: "Создано AHdigital", priv_title: "Конфиденциальность",
    priv_p: "Текст сообщения не сохраняется на сервере — только результат для статистики. Номера телефонов и карт — только в зашифрованном виде. История — только на этом телефоне.",
    kind_msg: "Сообщение", kind_file: "Файл", ago_now: "сейчас", share_text: "Защита от мошенников: проверьте подозрительное сообщение в приложении Tekshir 👇" }
};
const S = { lang: store.get("tk_lang", (navigator.language || "").startsWith("ru") ? "ru" : "uz"), text: "", busy: false, res: null, err: "", cat: "all" };
const t = k => (T[S.lang] || T.uz)[k] || T.uz[k] || k;
const apiLang = () => S.lang === "ru" ? "ru" : "uz-latn";

// Tarix: faqat telefonda. Raqamlar yashiriladi, matn qisqartiriladi.
const mask = s => String(s).replace(/\d[\d\s-]{6,}\d/g, m => m.replace(/\d(?=[\d\s-]{2})/g, "•")).slice(0, 80);
const hist = () => store.get("tk_hist", []);
function addHist(kind, preview, r) { const h = hist(); h.unshift({ k: kind, p: mask(preview), l: r.level, ti: r.title, at: Date.now() }); store.set("tk_hist", h.slice(0, 50)); }

const SHIELD = (c = "#22c55e") => `<svg class="shield" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><path d="M60 8l40 15v30c0 27-17 45-40 55C37 98 20 80 20 53V23z" fill="url(#g)"/><path d="M42 60l12 12 24-26" fill="none" stroke="#04130a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const LOGO = `<svg class="logo" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 8l40 15v30c0 27-17 45-40 55C37 98 20 80 20 53V23z" fill="#22c55e"/><path d="M42 60l12 12 24-26" fill="none" stroke="#04130a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const TIPS = window.TIPS || [], CATS = window.TIP_CATS || [];
const catName = id => (CATS.find(c => c[0] === id) || ["", "", ""])[2];
const tipOfDay = () => TIPS[Math.floor((Date.now() + 5 * 3600e3) / 864e5) % TIPS.length];
const tipCard = tp => tp ? `<div class="card"><span class="kicker">${esc(catName(tp[0]))}</span><b>${tp[1]} ${esc(tp[2])}</b><p class="muted">${esc(tp[3])}</p></div>` : "";

// ================= Ekranlar =================
const screens = {
  bosh() {
    const h = hist();
    return `
      <div class="top">${LOGO}<span class="brand">Tekshir</span><span class="pill">● ${S.lang === "ru" ? "активна" : "faol"}</span></div>
      <div class="hero"><div class="ring">${SHIELD()}</div></div>
      <div class="hero-t"><b>${t("protected")}</b><span class="muted">${t("hero_sub")}</span></div>
      <div class="stats"><div class="stat"><b>${h.length}</b><span>${t("checked")}</span></div><div class="stat"><b style="color:var(--danger)">${h.filter(x => x.l === "danger").length}</b><span>${t("dangers")}</span></div><div class="stat"><b>${TIPS.length}</b><span>${t("tips_n")}</span></div></div>
      <a class="btn" href="#tekshir">${t("check_btn")}</a>
      <div class="grid">
        <a class="tile" href="#tekshir" data-focus="1"><span class="ic">💬</span><b>${t("t_msg")}</b><span>${t("t_msg_s")}</span></a>
        <a class="tile" href="#tekshir" data-focus="1"><span class="ic">🔗</span><b>${t("t_link")}</b><span>${t("t_link_s")}</span></a>
        <button class="tile" type="button" data-act="file"><span class="ic">📎</span><b>${t("t_apk")}</b><span>${t("t_apk_s")}</span></button>
        <a class="tile" href="#tekshir" data-focus="1"><span class="ic">📞</span><b>${t("t_num")}</b><span>${t("t_num_s")}</span></a>
      </div>
      <span class="kicker">${t("tip_day")}</span>${tipCard(tipOfDay())}`;
  },
  tekshir() {
    const r = S.res;
    return `
      <div class="top">${LOGO}<span class="brand">${t("check_title")}</span></div>
      <form id="f" style="display:flex;flex-direction:column;gap:10px" novalidate>
        <label for="tx" class="muted">${t("ph")}</label>
        <textarea id="tx" maxlength="4000" placeholder="${esc(t("ph"))}">${esc(S.text)}</textarea>
        <div class="row2"><button class="btn ghost" type="button" data-act="paste">${t("paste")}</button><button class="btn ghost" type="button" data-act="file">${t("file")}</button></div>
        <button class="btn" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? t("checking") : t("check_btn")}</button>
      </form>
      ${S.err ? `<p class="err" role="alert">${esc(S.err)}</p>` : ""}
      ${r ? resultHtml(r) : ""}
      <p class="note">${t("privacy")}</p>`;
  },
  tarix() {
    const h = hist();
    const ago = ts => { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? t("ago_now") : new Date(ts).toLocaleString(S.lang === "ru" ? "ru-RU" : "uz-UZ", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };
    return `
      <div class="top">${LOGO}<span class="brand">${t("hist_title")}</span></div>
      ${h.length ? h.map(x => `<div class="h-item"><span class="dot ${x.l}"></span><div><p>${esc(x.p) || (x.k === "file" ? t("kind_file") : t("kind_msg"))}</p><small>${esc(x.ti)} · ${ago(x.at)}</small></div></div>`).join("") : `<div class="card"><p class="muted">${t("hist_empty")}</p></div>`}
      <p class="note">${t("hist_note")}</p>
      ${h.length ? `<button class="btn ghost" type="button" data-act="clear">${t("clear")}</button>` : ""}`;
  },
  maslahat() {
    const list = TIPS.filter(x => S.cat === "all" || x[0] === S.cat);
    return `
      <div class="top">${LOGO}<span class="brand">${t("tips_title")}</span></div>
      <div class="chips" role="group">${[["all", `${t("all")} · ${TIPS.length}`], ...CATS.map(c => [c[0], `${c[1]} ${c[2]}`])].map(([id, l]) => `<button class="chip" type="button" data-cat="${id}" aria-pressed="${S.cat === id}">${esc(l)}</button>`).join("")}</div>
      ${list.map(tipCard).join("")}
      <button class="btn ghost" type="button" data-act="share">${t("share_tips")}</button>`;
  },
  haqida() {
    return `
      <div class="top">${LOGO}<span class="brand">${t("about_title")}</span></div>
      <div class="card"><p>${t("about_p")}</p></div>
      <div class="card"><span class="kicker">${t("how")}</span><p>1. ${t("how_1")}</p><p>2. ${t("how_2")}</p><p>3. ${t("how_3")}</p></div>
      <div class="card"><span class="kicker">${t("lang")}</span><div class="sel"><button class="chip" type="button" data-lang="uz" aria-pressed="${S.lang === "uz"}">O'zbekcha</button><button class="chip" type="button" data-lang="ru" aria-pressed="${S.lang === "ru"}">Русский</button></div></div>
      <div class="card"><span class="kicker">${t("priv_title")}</span><p class="muted">${t("priv_p")}</p></div>
      <a class="card" style="text-decoration:none;color:var(--text)" href="https://t.me/tekshirbot_bot?start=tekshirapp" target="_blank" rel="noopener"><b>✈️ ${t("bot")}</b><span class="muted">${t("bot_s")}</span></a>
      <p class="note" style="text-align:center">${t("made")} · <a class="link" href="https://www.ah-digital.uz" target="_blank" rel="noopener">ah-digital.uz</a></p>`;
  }
};

function resultHtml(r) {
  const ic = { safe: "✓", suspicious: "!", danger: "✕" }[r.level] || "✓";
  return `<section id="res" class="res ${r.level}">
    <div class="res-h"><span class="res-ic" aria-hidden="true">${ic}</span><b>${esc(String(r.title).replace(/^[^\p{L}]+/u, ""))}</b></div>
    ${r.reasons.length ? `<div><span class="kicker">${t("why")}</span><ul>${r.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${(r.numbers || []).length ? `<div><span class="kicker">${t("nums")}</span><ul>${r.numbers.map(n => `<li>${esc(n.masked)} — ${n.count ? `<b>${n.count} ${t("reports")}</b>` : t("no_reports")}</li>`).join("")}</ul><p class="note">${t("rep_note")}</p></div>` : ""}
    ${r.advice.length ? `<div><span class="kicker">${t("todo")}</span><ul class="plain">${r.advice.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
  </section>`;
}

// ================= Tekshirish =================
async function check(payload, kind, preview) {
  S.busy = true; S.err = ""; S.res = null;
  if (location.hash !== "#tekshir") location.hash = "tekshir"; else render();
  try {
    const r = await fetch("/api/check", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...payload, lang: apiLang(), app: "tekshir" }) });
    if (r.status === 429) throw new Error(t("busy"));
    if (!r.ok) throw new Error(t("fail"));
    S.res = await r.json();
    addHist(kind, preview, S.res);
  } catch (e) { S.err = e.message === "Failed to fetch" ? t("net") : e.message; }
  S.busy = false; render();
  $("#res")?.scrollIntoView({ behavior: "smooth", block: "start" });
}
async function sha256(file) { const h = await crypto.subtle.digest("SHA-256", await file.arrayBuffer()); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join(""); }
const picker = Object.assign(document.createElement("input"), { type: "file", hidden: true });
document.body.append(picker);
picker.addEventListener("change", async () => {
  const f = picker.files[0]; if (!f) return;
  const file = { name: f.name, size: f.size, mime: f.type || "" };
  if (f.size <= 100 * 1024 * 1024) { try { file.sha256 = await sha256(f); } catch { /* nomi bo'yicha */ } }
  picker.value = "";
  check({ file }, "file", "📎 " + f.name);
});

// ================= Marshrut va harakatlar =================
const view = $("#view");
function current() { const h = location.hash.slice(1); return screens[h] ? h : "bosh"; }
function render() {
  const name = current();
  document.documentElement.lang = S.lang === "ru" ? "ru" : "uz";
  view.innerHTML = screens[name]();
  document.querySelectorAll("nav a").forEach(a => a.dataset.tab === name || (name === "tekshir" && a.dataset.tab === "bosh") ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
}
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act],[data-cat],[data-lang],[data-focus]"); if (!el) return;
  if (el.dataset.focus) setTimeout(() => $("#tx")?.focus(), 50);
  if (el.dataset.cat) { S.cat = el.dataset.cat; render(); $(".chip[aria-pressed='true']")?.scrollIntoView({ inline: "center", block: "nearest" }); }
  if (el.dataset.lang) { S.lang = el.dataset.lang; store.set("tk_lang", S.lang); render(); }
  const a = el.dataset.act;
  if (a === "file") picker.click();
  if (a === "paste") { try { S.text = await navigator.clipboard.readText(); render(); } catch { alert(t("paste_fail")); } }
  if (a === "clear" && confirm(t("clear_q"))) { store.set("tk_hist", []); render(); }
  if (a === "share" && navigator.share) navigator.share({ title: "Tekshir", text: t("share_text"), url: location.origin + "/?ref=ulash" }).catch(() => {});
});
document.addEventListener("input", e => { if (e.target.id === "tx") S.text = e.target.value; });
document.addEventListener("submit", e => {
  if (e.target.id !== "f") return;
  e.preventDefault();
  const text = S.text.trim();
  if (!text) { S.err = t("empty"); render(); return; }
  check({ text }, "msg", text);
});

// «Ulashish → Tekshir»: boshqa ilova /share?title=&text=&url= bilan ochadi — darhol tekshiramiz
(function shared() {
  const q = new URLSearchParams(location.search);
  const parts = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean);
  if (location.pathname === "/share" && parts.length) {
    S.text = [...new Set(parts)].join("\n");
    history.replaceState(null, "", "/#tekshir");
    check({ text: S.text }, "msg", S.text);
  }
})();

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
