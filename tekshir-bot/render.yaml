# Render.com sozlamasi — Tekshir bot uchun (10-bosqich).
# DIQQAT: bu fayl tekshir-bot papkasida turibdi (repozitoriy ildizida emas), shuning uchun
# Render uni O'ZI qo'llamaydi — xizmatni Render sahifasida qo'lda yaratasiz (README).
# Qanday ishlatish — README.md, "Serverga qo'yish" bo'limi.
services:
  - type: web
    name: tekshir-bot
    runtime: node
    rootDir: tekshir-bot
    plan: free               # BEPUL. 15 daqiqa xabar bo'lmasa uxlaydi; qayta uyg'onganda baza bo'sh bo'ladi
    region: frankfurt        # O'zbekistonga eng yaqin
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    # Pullik variantga o'tganda (starter, ≈ $7/oy) bazani saqlash uchun disk qo'shiladi:
    # disk: { name: tekshir-data, mountPath: /var/data, sizeGB: 1 }   va  DB_PATH=/var/data/tekshir.db
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUTO_LANG       # baza o'chganda ham tilni qayta so'ramaslik uchun
        value: "1"
      - key: WEBHOOK_SECRET
        generateValue: true  # Render o'zi tasodifiy maxfiy kalit yaratadi
      - key: BOT_TOKEN
        sync: false          # sync: false — qiymatni Render sahifasida O'ZINGIZ kiritasiz (GitHub'da turmaydi)
      - key: ADMIN_IDS
        sync: false
      - key: HASH_SALT
        sync: false
      - key: VIRUSTOTAL_KEY
        sync: false
      - key: SAFE_BROWSING_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
